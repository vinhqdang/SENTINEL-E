[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-e"
version = "1.0.0"
description = "Anytime-valid sequential detection for streaming illegal dumping surveillance"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Quang-Vinh Dang", email = "vinh.dq4@buv.edu.vn" }]
keywords = [
    "anytime-valid inference", "e-values", "conformal prediction",
    "sequential change detection", "illegal dumping detection",
    "video surveillance", "false discovery rate",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
# The graph layer is the only part that needs a deep-learning framework; the
# episodic e-process and the conformal layer are numpy and scipy only.
graph = ["torch>=2.0"]
experiments = ["matplotlib>=3.5", "pandas>=1.4"]
dev = ["pytest>=7.0"]
all = ["torch>=2.0", "matplotlib>=3.5", "pandas>=1.4", "pytest>=7.0"]

[project.urls]
Repository = "https://github.com/vinhqdang/SENTINEL-E"

[tool.setuptools.packages.find]
include = ["sentinel_e*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
